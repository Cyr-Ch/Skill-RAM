<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Skill-RAM: install every skill, load only what the task needs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#13181f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8cff98"/>
      <stop offset="1" stop-color="#57e0c8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="none" stroke="#1f2730" stroke-width="2"/>

  <!-- Left: wordmark + tagline -->
  <text x="80" y="150" fill="#ffffff" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="76" font-weight="700" letter-spacing="1">Skill<tspan fill="url(#accent)">RAM</tspan></text>
  <text x="82" y="205" fill="#b8bec9" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="27">Install every skill. Load only what the task needs.</text>

  <!-- Left: stat pills -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <rect x="80" y="255" width="235" height="72" rx="12" fill="#10151b" stroke="#243040" stroke-width="1.5"/>
    <text x="100" y="288" fill="#8cff98" font-size="30" font-weight="700">97.6%</text>
    <text x="100" y="312" fill="#9aa4b2" font-size="15">fewer skill tokens</text>

    <rect x="330" y="255" width="215" height="72" rx="12" fill="#10151b" stroke="#243040" stroke-width="1.5"/>
    <text x="350" y="288" fill="#8cff98" font-size="30" font-weight="700">91.3%</text>
    <text x="350" y="312" fill="#9aa4b2" font-size="15">routing Hit@1</text>

    <rect x="560" y="255" width="245" height="72" rx="12" fill="#10151b" stroke="#243040" stroke-width="1.5"/>
    <text x="580" y="288" fill="#8cff98" font-size="30" font-weight="700">local</text>
    <text x="580" y="312" fill="#9aa4b2" font-size="15">no cloud, no keys</text>
  </g>

  <!-- Right: concept, many dim skills funnel into a small bright RAM -->
  <g transform="translate(620,55)">
    <!-- installed skills grid (dim) -->
    <text x="0" y="-16" fill="#6b7686" font-family="ui-monospace, monospace" font-size="14">137 skills installed</text>
    <g>
      <!-- rows of dim chips -->
      <g fill="#202a35">
        <rect x="0"   y="0"  width="42" height="26" rx="5"/>
        <rect x="52"  y="0"  width="42" height="26" rx="5"/>
        <rect x="104" y="0"  width="42" height="26" rx="5"/>
        <rect x="0"   y="34" width="42" height="26" rx="5"/>
        <rect x="52"  y="34" width="42" height="26" rx="5"/>
        <rect x="104" y="34" width="42" height="26" rx="5"/>
        <rect x="0"   y="68" width="42" height="26" rx="5"/>
        <rect x="52"  y="68" width="42" height="26" rx="5"/>
        <rect x="104" y="68" width="42" height="26" rx="5"/>
        <rect x="0"   y="102" width="42" height="26" rx="5"/>
        <rect x="52"  y="102" width="42" height="26" rx="5"/>
        <rect x="104" y="102" width="42" height="26" rx="5"/>
      </g>
    </g>

    <!-- router arrow -->
    <g transform="translate(170,60)">
      <path d="M0 4 H70" stroke="#3a4756" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
      <text x="8" y="-8" fill="#8cff98" font-family="ui-monospace, monospace" font-size="13">route</text>
    </g>

    <!-- RAM module with only the loaded skills, bright -->
    <g transform="translate(250,-6)">
      <rect x="0" y="0" width="176" height="150" rx="14" fill="#0e1620" stroke="url(#accent)" stroke-width="2" filter="url(#glow)"/>
      <text x="88" y="26" text-anchor="middle" fill="#8cff98" font-family="ui-monospace, monospace" font-size="15" font-weight="700">RAM</text>
      <text x="88" y="44" text-anchor="middle" fill="#6b7686" font-family="ui-monospace, monospace" font-size="12">working set</text>
      <rect x="24" y="60" width="128" height="28" rx="6" fill="#123020" stroke="#8cff98" stroke-width="1.5"/>
      <text x="88" y="79" text-anchor="middle" fill="#8cff98" font-family="ui-monospace, monospace" font-size="13">react-review</text>
      <rect x="24" y="98" width="128" height="28" rx="6" fill="#123020" stroke="#8cff98" stroke-width="1.5"/>
      <text x="88" y="117" text-anchor="middle" fill="#8cff98" font-family="ui-monospace, monospace" font-size="13">pdf-extraction</text>
    </g>
    <text x="338" y="170" text-anchor="middle" fill="#6b7686" font-family="ui-monospace, monospace" font-size="13">only what the task needs</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8cff98"/>
    </marker>
  </defs>
</svg>
