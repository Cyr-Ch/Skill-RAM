<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Skill-RAM: install every skill, load only what the task needs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#13181f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8cff98"/>
      <stop offset="1" stop-color="#57e0c8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8cff98"/>
    </marker>
  </defs>

  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="438" fill="none" stroke="#1f2730" stroke-width="2"/>

  <!-- Left: wordmark + tagline -->
  <text x="80" y="150" fill="#ffffff" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="76" font-weight="700" letter-spacing="1">Skill<tspan fill="url(#accent)">RAM</tspan></text>
  <text x="82" y="200" fill="#b8bec9" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="25">Install every skill. Load only what the task needs.</text>

  <!-- Right: concept, dim skills route into a small bright RAM that stays resident -->
  <g transform="translate(640,20)" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="0" y="-4" fill="#6b7686" font-size="14">137 skills installed</text>
    <g fill="#202a35">
      <rect x="0"   y="10"  width="40" height="24" rx="5"/>
      <rect x="50"  y="10"  width="40" height="24" rx="5"/>
      <rect x="100" y="10"  width="40" height="24" rx="5"/>
      <rect x="0"   y="42"  width="40" height="24" rx="5"/>
      <rect x="50"  y="42"  width="40" height="24" rx="5"/>
      <rect x="100" y="42"  width="40" height="24" rx="5"/>
      <rect x="0"   y="74"  width="40" height="24" rx="5"/>
      <rect x="50"  y="74"  width="40" height="24" rx="5"/>
      <rect x="100" y="74"  width="40" height="24" rx="5"/>
      <rect x="0"   y="106" width="40" height="24" rx="5"/>
      <rect x="50"  y="106" width="40" height="24" rx="5"/>
      <rect x="100" y="106" width="40" height="24" rx="5"/>
    </g>

    <!-- route arrow -->
    <path d="M160 76 H224" stroke="#8cff98" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="168" y="66" fill="#8cff98" font-size="13">route</text>

    <!-- RAM module: only the loaded skills, kept resident -->
    <g transform="translate(238,-4)">
      <rect x="0" y="0" width="182" height="168" rx="14" fill="#0e1620" stroke="url(#accent)" stroke-width="2" filter="url(#glow)"/>
      <text x="91" y="26" text-anchor="middle" fill="#8cff98" font-size="15" font-weight="700">RAM</text>
      <text x="91" y="44" text-anchor="middle" fill="#6b7686" font-size="12">working set</text>
      <rect x="24" y="58" width="134" height="26" rx="6" fill="#123020" stroke="#8cff98" stroke-width="1.5"/>
      <text x="91" y="76" text-anchor="middle" fill="#8cff98" font-size="13">react-review</text>
      <rect x="24" y="92" width="134" height="26" rx="6" fill="#123020" stroke="#8cff98" stroke-width="1.5"/>
      <text x="91" y="110" text-anchor="middle" fill="#8cff98" font-size="13">pdf-extraction</text>
      <text x="91" y="146" text-anchor="middle" fill="#7f8b99" font-size="12">kept across compaction</text>
    </g>
  </g>

  <!-- Bottom: four stat pills, including the memory system -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <rect x="80" y="258" width="232" height="80" rx="12" fill="#10151b" stroke="#243040" stroke-width="1.5"/>
    <text x="102" y="298" fill="#8cff98" font-size="32" font-weight="700">97.6%</text>
    <text x="102" y="322" fill="#9aa4b2" font-size="15">fewer skill tokens</text>

    <rect x="324" y="258" width="232" height="80" rx="12" fill="#10151b" stroke="#243040" stroke-width="1.5"/>
    <text x="346" y="298" fill="#8cff98" font-size="32" font-weight="700">91.3%</text>
    <text x="346" y="322" fill="#9aa4b2" font-size="15">routing Hit@1</text>

    <rect x="568" y="258" width="232" height="80" rx="12" fill="#0e1a14" stroke="#2f6b45" stroke-width="1.5"/>
    <text x="590" y="298" fill="#8cff98" font-size="32" font-weight="700">2&#215;</text>
    <text x="590" y="322" fill="#9aa4b2" font-size="15">working set retained</text>

    <rect x="812" y="258" width="232" height="80" rx="12" fill="#10151b" stroke="#243040" stroke-width="1.5"/>
    <text x="834" y="298" fill="#8cff98" font-size="32" font-weight="700">local</text>
    <text x="834" y="322" fill="#9aa4b2" font-size="15">no cloud, no keys</text>
  </g>

  <!-- Footer line: name the memory system -->
  <text x="82" y="380" fill="#6b7686" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15">RAM memory hierarchy: adaptive eviction, summary tier, refresh &amp; prefetch keep the right skills resident.</text>
</svg>
